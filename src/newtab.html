<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Awesome New Tab</title>
        <link rel="preconnect" href="https://www.bing.com" />
        <link rel="stylesheet" href="newtab.css" />
    </head>
    <body>
        <div class="wrap">
            <main class="center-column">
                <section class="panel">
                    <div id="clock" class="clock">--:--</div>

                    <form
                        id="searchForm"
                        class="search-form"
                        autocomplete="off"
                    >
                        <div class="search-shell">
                            <span class="search-icon" aria-hidden="true">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 640 640"
                                    fill="currentColor"
                                    style="width: 1.2em; height: 1.2em;"
                                >
                                    <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                                    <path
                                        d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"
                                    />
                                </svg>
                            </span>
                            <input
                                id="searchInput"
                                type="text"
                                placeholder="Search the web"
                                aria-label="Search the web"
                            />
                            <button type="submit" class="search-btn">
                                Search
                            </button>
                        </div>
                    </form>

                    <div class="meta" id="status">
                        loading today’s wallpaper…
                    </div>
                </section>

                <section class="list-card recent-sites">
                    <h2>Recent sites</h2>
                    <div id="historyList" class="item-list icon-grid"></div>
                </section>

                <section class="list-card tabs-section">
                    <h2>Open tabs</h2>
                    <div id="tabsList" class="item-list tabs-grid"></div>
                </section>
            </main>
        </div>

        <script src="newtab.js"></script>
    </body>
</html>
